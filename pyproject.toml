[project]
name = "paper-rag"
version = "0.1.0"
description = "RAG over PubMed papers (JATS XML/PDF/HTML) using docling + Chroma, packaged as a Claude Code plugin"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "docling>=2.0.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "rank-bm25>=0.2.2",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
